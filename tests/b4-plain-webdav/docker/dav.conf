# Apache mod_dav config for the b-4 layer: a deliberately ORDINARY WebDAV server.
#
# The point of this layer is that the server must NOT look like Nextcloud in any way, so there is no
# /status.php and no /ocs endpoint here — both 404, which is exactly what the detection under test has
# to cope with.
#
# DavDepthInfinity is deliberately NOT set. Apache's default is `off`, which makes a
# `PROPFIND Depth: infinity` be refused — and that refusal is the whole reason StandardWebDAVClient
# walks the tree with Depth: 1. Writing `DavDepthInfinity on` here would quietly delete the property
# this layer exists to prove, so the absence of that line is load-bearing.

DavLockDB /usr/local/apache2/var/DavLock

Alias /dav /var/dav

<Directory /var/dav>
    Dav On
    Options Indexes
    AllowOverride None

    AuthType Basic
    AuthName "b4"
    AuthUserFile /usr/local/apache2/dav.passwd
    Require valid-user
</Directory>
