# Docker test suite: every test layer runs in containers on the local Docker host.
# Entry point: bash tests/docker/run.sh <a|b1|b2|b3|b4|all>  (never run compose directly).
#
# Required variables (exported by run.sh; `:?` fails fast when one is missing):
#   SUITE_RUNNER_TAG, SUITE_NEXTCLOUD_TAG, SUITE_WEBDAV_TAG, SUITE_REDROID_TAG   image tags (content hashes)
#   SUITE_OUT_DIR, SUITE_RUN_ID, SUITE_HOST_UID, SUITE_HOST_GID
#   SUITE_ANDROID_PROFILE   name of the AppArmor profile in redroid/apparmor.profile
#   SUITE_CA_CERT_PEM, SUITE_TLS_CERT_PEM, SUITE_TLS_KEY_PEM, SUITE_CA_HASH
#   SUITE_NC_ADMIN_PASSWORD, SUITE_NC_USER2_PASSWORD, SUITE_NC_DB_PASSWORD
# Per-run secrets are generated by gen-run-material.sh and handed over through the
# `environment:` source of configs/secrets, so they never touch the host disk.
name: ncs-suite

services:
  nc-db:
    image: postgres:16-alpine
    profiles: ["nc"]
    environment:
      POSTGRES_DB: nextcloud
      POSTGRES_USER: nextcloud
      POSTGRES_PASSWORD_FILE: /run/secrets/nc_db_password
    secrets: [nc_db_password]
    volumes:
      - nc-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nextcloud -d nextcloud"]
      interval: 2s
      timeout: 3s
      retries: 60

  nc-redis:
    image: redis:7-alpine
    profiles: ["nc"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 60

  nc-app:
    build:
      context: ./nextcloud
    image: ncs-suite-nextcloud:${SUITE_NEXTCLOUD_TAG:?}
    profiles: ["nc"]
    depends_on:
      nc-db: { condition: service_healthy }
      nc-redis: { condition: service_healthy }
    environment:
      POSTGRES_HOST: nc-db
      POSTGRES_DB: nextcloud
      POSTGRES_USER: nextcloud
      POSTGRES_PASSWORD_FILE: /run/secrets/nc_db_password
      NEXTCLOUD_ADMIN_USER: ncadmin
      NEXTCLOUD_ADMIN_PASSWORD_FILE: /run/secrets/nc_admin_password
      NEXTCLOUD_TRUSTED_DOMAINS: nc.test
      REDIS_HOST: nc-redis
      OVERWRITEPROTOCOL: https
      OVERWRITECLIURL: https://nc.test
      PHP_UPLOAD_LIMIT: 2G
      PHP_MEMORY_LIMIT: 512M
    secrets: [nc_db_password, nc_admin_password, nc_user2_password]
    volumes:
      - nc-html:/var/www/html
    healthcheck:
      test: ["CMD-SHELL", "test -f /var/www/html/data/.suite-ready && curl -fsS http://localhost/status.php | grep -q '\"installed\":true'"]
      interval: 3s
      timeout: 5s
      retries: 100
      start_period: 300s

  # Side-car that lets b-1 "N actor" tests write to the Nextcloud data directory and trigger a
  # rescan without SSH and without a Docker socket. Same image, same volume, uid 33.
  nc-fsops:
    image: ncs-suite-nextcloud:${SUITE_NEXTCLOUD_TAG:?}
    profiles: ["nc"]
    user: "33:33"
    depends_on:
      nc-app: { condition: service_healthy }
    entrypoint: ["php", "-S", "0.0.0.0:8080", "/opt/fsops/router.php"]
    environment:
      PHP_CLI_SERVER_WORKERS: "8"
    secrets: [nc_db_password]
    volumes:
      - nc-html:/var/www/html

  nc-edge:
    image: caddy:2
    profiles: ["nc"]
    depends_on:
      nc-app: { condition: service_healthy }
    configs:
      - source: suite_tls_cert
        target: /run/suite/tls.crt
    secrets:
      - source: suite_tls_key
        target: suite_tls_key
    volumes:
      - ./edge/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
    networks:
      default:
        aliases: [nc.test]

  webdav:
    build:
      context: ../b4-plain-webdav/docker
    image: ncs-suite-webdav:${SUITE_WEBDAV_TAG:?}
    profiles: ["webdav"]

  redroid:
    build:
      context: ./redroid
    image: ncs-suite-redroid:${SUITE_REDROID_TAG:?}
    profiles: ["android"]
    # Privileged, so Android's init would rewrite host-wide sysctls and the owners and modes of files
    # under /proc and /sys. The profile (redroid/apparmor.profile) is what stops it; run.sh checks that
    # the host enforces it before anything starts.
    privileged: true
    security_opt:
      - apparmor=${SUITE_ANDROID_PROFILE:?}
    # The profile lets Android write below /sys/fs/cgroup, which must then be its own subtree.
    cgroup: private
    command:
      - androidboot.redroid_net_ndns=1
      - androidboot.redroid_net_dns1=127.0.0.11
    configs:
      - source: suite_ca
        target: /system/etc/security/cacerts/${SUITE_CA_HASH:?}.0
    volumes:
      - redroid-data:/data

  runner:
    build:
      context: ../..
      dockerfile: tests/docker/runner/Dockerfile
    image: ncs-suite-runner:${SUITE_RUNNER_TAG:?}
    profiles: ["runner"]
    shm_size: 2gb
    environment:
      SUITE_REQUIRE_ENV: "1"
      NODE_EXTRA_CA_CERTS: /run/suite/ca.crt
      SUITE_HOST_UID: ${SUITE_HOST_UID:?}
      SUITE_HOST_GID: ${SUITE_HOST_GID:?}
      SUITE_RUN_ID: ${SUITE_RUN_ID:?}
      SUITE_CA_HASH: ${SUITE_CA_HASH:?}
      NEXTCLOUD_SERVER_URL: https://nc.test/remote.php/dav/files/ncadmin/
      NEXTCLOUD_USER: ncadmin
      NEXTCLOUD_VAULT_NAME: ""
      NEXTCLOUD_FSOPS_URL: http://nc-fsops:8080
      NEXTCLOUD_USER2: ncuser2
      NEXTCLOUD_SERVER_URL2: https://nc.test/remote.php/dav/files/ncuser2/
      ANDROID_SERIAL: redroid:5555
      B3_DIAGNOSTICS_DIR: /out/b3
      B3_RETRY_RECORD: /out/b3/retries.txt
      B4_SERVER_URL: http://webdav/dav/
      B4_USER: davuser
      B4_PASSWORD: davpass
    configs:
      - source: suite_ca
        target: /run/suite/ca.crt
    secrets: [nc_admin_password, nc_user2_password]
    volumes:
      - ../..:/src:ro
      - ${SUITE_OUT_DIR:?}:/out
      - ncs-suite-cache-obsidian:/work/.obsidian-cache
      - ncs-suite-cache-obsidian-android:/work/.obsidian-cache-android

configs:
  suite_ca:
    environment: SUITE_CA_CERT_PEM
  suite_tls_cert:
    environment: SUITE_TLS_CERT_PEM

secrets:
  suite_tls_key:
    environment: SUITE_TLS_KEY_PEM
  nc_admin_password:
    environment: SUITE_NC_ADMIN_PASSWORD
  nc_user2_password:
    environment: SUITE_NC_USER2_PASSWORD
  nc_db_password:
    environment: SUITE_NC_DB_PASSWORD

volumes:
  nc-html:
  nc-db:
  caddy-data:
  redroid-data:
  # Caches survive between runs; run.sh creates them if missing.
  ncs-suite-cache-obsidian:
    external: true
  ncs-suite-cache-obsidian-android:
    external: true
